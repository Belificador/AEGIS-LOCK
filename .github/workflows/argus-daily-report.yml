name: Argus daily report

on:
  schedule:
    - cron: "0 8 * * *"
      timezone: "UTC"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argus-daily-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate and send Argus report
        run: python -m backend.jobs.daily_argus_report
        env:
          ENVIRONMENT: production
          AEGIS_SERVICE_ROLE: argus_cron
          ARGUS_REPORT_TIMEZONE: UTC
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARGUS_REPORT_DATABASE_URL: ${{ secrets.ARGUS_REPORT_DATABASE_URL }}
